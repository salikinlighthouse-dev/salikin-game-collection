        // --- SOUND SYNTHESIZER (Web Audio API) ---
        class AudioManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            toggle() {
                this.enabled = !this.enabled;
                document.getElementById('audio-status-text').innerText = this.enabled ? 'Bunyi: ON' : 'Bunyi: OFF';
                this.playClick();
                return this.enabled;
            }
            playTone(freq, type, duration, delay = 0) {
                if (!this.enabled) return;
                try {
                    this.init();
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    }, delay);
                } catch(e) {}
            }
            playClick() {
                this.playTone(600, 'sine', 0.08);
            }
            playCorrect() {
                this.playTone(523.25, 'triangle', 0.15, 0); // C5
                this.playTone(659.25, 'triangle', 0.15, 100); // E5
                this.playTone(783.99, 'triangle', 0.25, 200); // G5
            }
            playWrong() {
                this.playTone(300, 'sawtooth', 0.2, 0);
                this.playTone(220, 'sawtooth', 0.3, 150);
            }
            speak(text) {
                if (!this.enabled) return;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ms-MY';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        // --- APP STATE MANAGEMENT ---
        class AppState {
            constructor() {
                this.load();
            }
            load() {
                const data = JSON.parse(localStorage.getItem('jom3m_user_state')) || {
                    username: '',
                    score: 0,
                    stars: 0,
                    gamesPlayed: 0,
                    completedGames: [],
                    highestScore: 0,
                    level: 1, // 1: 4yo, 2: 5yo, 3: 6yo
                    timerOption: 0, // 0: Tanpa masa, 60, 90, 120
                    gallery: [] // saved coloring drawings
                };
                this.username = data.username;
                this.score = data.score;
                this.stars = data.stars;
                this.gamesPlayed = data.gamesPlayed;
                this.completedGames = data.completedGames || [];
                this.highestScore = data.highestScore;
                this.level = data.level || 1;
                this.timerOption = data.timerOption || 0;
                this.gallery = data.gallery || [];
            }
            save() {
                const data = {
                    username: this.username,
                    score: this.score,
                    stars: this.stars,
                    gamesPlayed: this.gamesPlayed,
                    completedGames: this.completedGames,
                    highestScore: this.highestScore,
                    level: this.level,
                    timerOption: this.timerOption,
                    gallery: this.gallery
                };
                localStorage.setItem('jom3m_user_state', JSON.stringify(data));
            }
            addScore(pts) {
                this.score += pts;
                if (this.score > this.highestScore) {
                    this.highestScore = this.score;
                }
                // Check bonus stars every 5 correct answers (approx 50 pts)
                if (this.score > 0 && Math.floor(this.score / 50) > this.stars) {
                    this.stars++;
                    showModal('⭐', 'BINTANG BONUS!', 'Kamu mendapat 1 bintang baru kerana cemerlang!');
                }
                this.save();
            }
            resetSession() {
                this.score = 0;
                this.save();
            }
        }
        const state = new AppState();

        // --- ROUTER SYSTEM ---
        class Router {
            constructor() {
                this.history = ['login'];
                this.currentView = 'login';
            }
            navigate(viewName, params = {}) {
                audioManager.playClick();
                this.history.push(viewName);
                this.currentView = viewName;
                this.render(params);
            }
            goHome() {
                if (!state.username) {
                    this.navigate('login');
                    return;
                }
                audioManager.playClick();
                this.history = ['menu'];
                this.currentView = 'menu';
                this.render();
            }
            goBack() {
                audioManager.playClick();
                if (this.history.length > 1) {
                    this.history.pop();
                    this.currentView = this.history[this.history.length - 1];
                    this.render();
                } else {
                    this.goHome();
                }
            }
            render(params = {}) {
                const header = document.getElementById('app-header');
                const container = document.getElementById('app-container');
                
                if (this.currentView === 'login') {
                    header.classList.add('hidden');
                    container.innerHTML = renderLoginView();
                } else {
                    header.classList.remove('hidden');
                    document.getElementById('badge-name').innerText = state.username || 'Kawan';
                    
                    switch(this.currentView) {
                        case 'menu': container.innerHTML = renderMainMenuView(); break;
                        case 'level': container.innerHTML = renderLevelView(); break;
                        case 'gamelist': container.innerHTML = renderGameListView(); break;
                        case 'timer': container.innerHTML = renderTimerView(params.gameType); break;
                        case 'game': renderGameEngine(params.gameType, container); break;
                        case 'flashcards': renderFlashCardsView(container); break;
                        case 'stories': renderStoriesListView(container); break;
                        case 'story_read': renderStoryReadView(container, params.storyId); break;
                        case 'coloring': renderColoringStudio(container); break;
                        case 'gallery': renderGalleryView(container); break;
                        case 'progress': container.innerHTML = renderProgressView(); break;
                        default: container.innerHTML = renderMainMenuView();
                    }
                }
                window.scrollTo(0,0);
            }
        }

            const btnContainer = document.getElementById('modal-buttons');

                document.getElementById('modal-ok-btn').onclick = () => { closeModal(); onOk(); };
            } else {
                btnContainer.innerHTML = `<button onclick="closeModal()" class="btn-bouncy bg-teal-500 hover:bg-teal-600 text-white font-bold px-6 py-3 rounded-2xl shadow-lg">Teruskan</button>`;
            }
            document.getElementById('modal-overlay').classList.remove('hidden');
            audioManager.playCorrect();
            if(window.confetti) {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
        }

            audioManager.playClick();

            if (!input) {

                alert('Sila masukkan nama kamu dahulu ya!');

            state.save();

        // --- GAME ENGINE ---
        function renderGameEngine(gameType, container) {
            state.gamesPlayed++;
            state.save();

            let currentQuestionIndex = 0;
            let score = 0;
            let wrongAttempts = 0;
            let questions = generateQuestions(gameType);
            let timerInterval = null;
            let timeLeft = state.timerOption;

            function renderQ() {
                if (currentQuestionIndex >= questions.length) {
                    if (timerInterval) clearInterval(timerInterval);
                    showModal('🏆', 'TAHNIAH, HEBAT!', `Kamu telah berjaya menyiapkan permainan ini dengan ${score} markah!`, () => {
                        router.navigate('gamelist');
                    });
                    return;
                }

                const q = questions[currentQuestionIndex];
                const progressPct = ((currentQuestionIndex) / questions.length) * 100;

                container.innerHTML = `
                    <div class="w-full max-w-2xl bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-teal-200 mb-6">
                        <!-- Top HUD -->
                        <div class="flex items-center justify-between mb-4 bg-teal-50 px-4 py-2 rounded-2xl">
                            <span class="font-bold text-teal-700 text-sm sm:text-base">Tahap ${state.level} • Soalan ${currentQuestionIndex + 1}/${questions.length}</span>

                                <span class="font-bold text-emerald-600 text-sm sm:text-base">🏆 ${score} Markah</span>
                                ${state.timerOption > 0 ? `<span id="timer-display" class="font-bold text-rose-600 text-sm sm:text-base">⏰ ${timeLeft}s</span>` : ''}
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-gray-200 h-3 rounded-full mb-6 overflow-hidden">
                            <div class="bg-teal-500 h-full rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
                        </div>

                        <!-- Question Prompt -->
                        <div class="text-center mb-6">
                            <span class="text-xs uppercase bg-teal-100 text-teal-800 px-3 py-1 rounded-full font-bold">${q.category || 'Aktiviti'}</span>
                            <h3 class="text-2xl sm:text-3xl font-bold text-teal-900 mt-2">${q.title}</h3>
                            <p class="text-gray-500 text-sm mt-1">${q.instruction}</p>
                        </div>

                        <!-- Main Question Visual Area -->
                        <div class="flex flex-col items-center justify-center mb-6">
                            ${q.visualHTML}
                        </div>

                        <!-- Answer Choices -->
                        <div id="choices-container" class="grid grid-cols-2 gap-4">
                            ${q.choices.map((c, idx) => `
                                <button onclick="window.checkGameAnswer(${idx})" class="btn-bouncy choice-btn bg-gradient-to-r from-teal-50 to-emerald-50 hover:from-teal-100 hover:to-emerald-100 border-3 border-teal-300 text-teal-900 font-bold py-4 px-6 rounded-2xl shadow-md text-xl flex items-center justify-center space-x-2">
                                    <span>${c}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                if (state.timerOption > 0 && !timerInterval) {
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        const tEl = document.getElementById('timer-display');
                        if (tEl) tEl.innerText = `⏰ ${timeLeft}s`;
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            showModal('⏰', 'Masa Tamat!', 'Tahniah kerana mencuba dengan baik!', () => router.navigate('gamelist'));
                        }
                    }, 1000);
                }
            }

            window.checkGameAnswer = (selectedIndex) => {
                const q = questions[currentQuestionIndex];
                const isCorrect = selectedIndex === q.correctIndex;

                if (isCorrect) {
                    audioManager.playCorrect();
                    score += 10;
                    state.addScore(10);
                    wrongAttempts = 0;

                    const randomMsgs = ["TAHNIAH!", "PANDAI!", "BETUL!", "HEBAT!"];
                    const randomMsg = randomMsgs[Math.floor(Math.random() * randomMsgs.length)];

                    if(window.confetti) {
                        confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
                    }

                    showModal('🎉', randomMsg, 'Jawapan kamu tepat sekali!', () => {
                        currentQuestionIndex++;
                        renderQ();
                    });
                } else {
                    wrongAttempts++;
                    audioManager.playWrong();
                    if (wrongAttempts >= 2) {
                        showModal('💡', 'Jawapan yang betul ialah...', `Pilihan yang tepat ialah: "${q.choices[q.correctIndex]}"`, () => {
                            wrongAttempts = 0;
                            currentQuestionIndex++;
                            renderQ();
                        });
                    } else {
                        showModal('🤔', 'Cuba Lagi!', 'Jom cuba sekali lagi dengan teliti.');
                    }
                }
            };

            renderQ();
        }

        // --- QUESTION GENERATOR ENGINE ---
        function generateQuestions(type) {
            let list = [];
            // Shuffle AZ_BANK for variety
            const shuffled = [...AZ_BANK].sort(() => 0.5 - Math.random());

            shuffled.forEach((item, index) => {
                if (index >= 6) return; // 6 questions per session

                if (type === 'blank') {
                    // Fill in the blank
                    let word = item.word;
                    let blankIdx = Math.floor(Math.random() * word.length);
                    let missingChar = word[blankIdx];
                    let displayWord = word.split('').map((char, i) => i === blankIdx ? '_' : char).join(' ');

                    let wrongChar1 = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    while(wrongChar1 === missingChar) wrongChar1 = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    let wrongChar2 = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    while(wrongChar2 === missingChar || wrongChar2 === wrongChar1) wrongChar2 = String.fromCharCode(65 + Math.floor(Math.random() * 26));

                    let choices = [missingChar, wrongChar1, wrongChar2].sort(() => 0.5 - Math.random());
                    let correctIndex = choices.indexOf(missingChar);

                    list.fromCharCode = true; // placeholder
                    list.push({
                        category: 'Isi Tempat Kosong',
                        title: displayWord,
                        instruction: `Apakah huruf yang hilang untuk ${word}?`,
                        visualHTML: `<div class="text-7xl mb-2">${item.image}</div><div class="text-lg font-bold text-teal-700">${word}</div>`,
                        choices,
                        correctIndex
                    });
                } else if (type === 'match_case') {
                    let isUpToLow = Math.random() > 0.5;
                    let target = isUpToLow ? item.letterUp : item.letterLow;
                    let correct = isUpToLow ? item.letterLow : item.letterUp;
                    
                    let wrongItem1 = shuffled[(index + 1) % shuffled.length];
                    let wrongItem2 = shuffled[(index + 2) % shuffled.length];
                    let wrong1 = isUpToLow ? wrongItem1.letterLow : wrongItem1.letterUp;
                    let wrong2 = isUpToLow ? wrongItem2.letterLow : wrongItem2.letterUp;

                    let choices = [correct, wrong1, wrong2].sort(() => 0.5 - Math.random());
                    let correctIndex = choices.indexOf(correct);

                    list.push({
                        category: 'Padanan Huruf',
                        title: `Pasangan bagi "${target}"?`,
                        instruction: 'Pilih pasangan huruf besar atau kecil yang betul.',
                        visualHTML: `<div class="text-8xl bg-teal-50 px-8 py-4 rounded-3xl border-4 border-teal-200 text-teal-800 shadow-inner">${target}</div>`,
                        choices,
                        correctIndex
                    });
                } else if (type === 'match_pic' || type === 'quiz') {
                    let correctWord = item.word;
                    let wrong1 = shuffled[(index + 1) % shuffled.length].word;
                    let wrong2 = shuffled[(index + 2) % shuffled.length].word;
                    let choices = [correctWord, wrong1, wrong2].sort(() => 0.5 - Math.random());
                    let correctIndex = choices.indexOf(correctWord);

                    list.push({
                        category: type === 'match_pic' ? 'Padankan Gambar' : 'Pilihan Jawapan',
                        title: type === 'match_pic' ? `Apakah perkataan bagi gambar ini?` : `Gambar apakah ini?`,
                        instruction: `Pilih jawapan yang paling tepat.`,
                        visualHTML: `<div class="text-8xl mb-3 bg-amber-50 p-6 rounded-3xl border-4 border-amber-200 shadow-inner">${item.image}</div><div class="text-teal-700 font-bold">Huruf Mula: ${item.letterUp}</div>`,
                        choices,
                        correctIndex
                    });
                } else if (type === 'order') {
                    // Order letters (Find missing letter in sequence A B _ D)
                    let baseIdx = index % 20;
                    let l1 = AZ_BANK[baseIdx].letterUp;
                    let l2 = AZ_BANK[baseIdx+1].letterUp;
                    let l3 = AZ_BANK[baseIdx+2].letterUp;
                    let l4 = AZ_BANK[baseIdx+3].letterUp;

                    let missingSlot = Math.floor(Math.random() * 4);
                    let correctChar = [l1, l2, l3, l4][missingSlot];
                    let seqDisplay = [l1, l2, l3, l4].map((c, i) => i === missingSlot ? '❓' : c).join('  ');

                    let wrong1 = String.fromCharCode(65 + ((baseIdx + 5) % 26));
                    let wrong2 = String.fromCharCode(65 + ((baseIdx + 9) % 26));
                    let choices = [correctChar, wrong1, wrong2].sort(() => 0.5 - Math.random());
                    let correctIndex = choices.indexOf(correctChar);

                    list.push({
                        category: 'Susun Urutan Abjad',
                        title: seqDisplay,
                        instruction: 'Apakah huruf yang sepatutnya berada di tempat ❓?',
                        visualHTML: `<div class="text-5xl font-bold tracking-widest text-teal-800 bg-teal-50 p-6 rounded-3xl border-4 border-teal-200">${seqDisplay}</div>`,
                        choices,
                        correctIndex
                    });
                } else {
                    // Drag and Drop simulation quiz
                    let correctWord = item.word;
                    let wrong1 = shuffled[(index + 3) % shuffled.length].word;
                    let choices = [correctWord, wrong1].sort(() => 0.5 - Math.random());
                    let correctIndex = choices.indexOf(correctWord);

                    list.push({
                        category: 'Seret dan Padan (Drag & Drop)',
                        title: `Padankan huruf [${item.letterUp}] ke objek yang betul:`,
                        instruction: 'Pilih padanan gambar yang tepat.',
                        visualHTML: `<div class="text-7xl font-bold text-teal-700 bg-teal-50 px-8 py-4 rounded-3xl border-4 border-teal-200 mb-3">${item.letterUp} ➔ ❓</div>`,
                        choices: [item.image + ' ' + correctWord, shuffled[(index+2)%shuffled.length].image + ' ' + wrong1],
                        correctIndex: 0
                    });
                }
            });
            return list;
        }

        let canvasCtx = null;
        let currentColor = '#ef4444';
        let isDrawing = false;

        function initCanvasEngine(templateName) {
            const canvas = document.getElementById('coloring-canvas');
            if (!canvas) return;
            canvasCtx = canvas.getContext('2d');
            redrawCanvasTemplate(templateName);

            let lastX = 0;
            let lastY = 0;

            function drawStart(e) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                lastX = clientX - rect.left;
                lastY = clientY - rect.top;
            }

            function drawMove(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const currentX = clientX - rect.left;
                const currentY = clientY - rect.top;

                canvasCtx.strokeStyle = currentColor;
                canvasCtx.lineWidth = 14;
                canvasCtx.lineCap = 'round';
                canvasCtx.lineJoin = 'round';

                canvasCtx.beginPath();
                canvasCtx.moveTo(lastX, lastY);
                canvasCtx.lineTo(currentX, currentY);
                canvasCtx.stroke();

                lastX = currentX;
                lastY = currentY;
            }

            function drawEnd() {
                isDrawing = false;
            }

            canvas.onmousedown = drawStart;
            canvas.onmousemove = drawMove;
            canvas.onmouseup = drawEnd;
            canvas.onmouseleave = drawEnd;

            canvas.ontouchstart = drawStart;
            canvas.ontouchmove = drawMove;
            canvas.ontouchend = drawEnd;
        }

        function redrawCanvasTemplate(name) {
            if (!canvasCtx) return;
            canvasCtx.fillStyle = '#ffffff';
            canvasCtx.fillRect(0, 0, 400, 350);

            // Draw template outline sketch
            canvasCtx.strokeStyle = '#1e293b';
            canvasCtx.lineWidth = 4;
            canvasCtx.font = '100px sans-serif';
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'middle';

            let emoji = '🐔';
            if (name === 'Bola') emoji = '⚽';
            else if (name === 'Ceri') emoji = '🍒';
            else if (name === 'Epal') emoji = '🍎';
            else if (name === 'Kucing') emoji = '🐱';
            else if (name === 'Bunga') emoji = '🌸';
            else if (name === 'Rumah') emoji = '🏠';
            else if (name === 'Pokok') emoji = '🌳';
            else if (name === 'Pelangi') emoji = '🌈';
            else if (name === 'Kereta') emoji = '🚗';

            canvasCtx.fillText(emoji, 200, 160);

            canvasCtx.font = '22px Fredoka, sans-serif';
            canvasCtx.fillStyle = '#0f766e';
            canvasCtx.fillText(`Karya: ${name}`, 200, 310);
        }

        function selectColor(color) {
            audioManager.playClick();
            currentColor = color;
        }

        function clearCanvas() {
            audioManager.playClick();
            const canvas = document.getElementById('coloring-canvas');
            if (canvas) {
                redrawCanvasTemplate('Ayam');
            }
        }

        function saveArtwork() {
            audioManager.playCorrect();

            const dataURL = canvas.toDataURL('image/png');
            state.gallery.push({ id: Date.now(), title: 'Karya Warnaku', image: dataURL, date: new Date().toLocaleDateString() });
            state.save();
            showModal('💾', 'BERJAYA DISIMPAN!', 'Hasil karya seni kamu telah disimpan ke dalam Galeri Saya!');
        }

            audioManager.playClick();
            const templates = ['Ayam', 'Bola', 'Ceri', 'Epal', 'Kucing', 'Bunga', 'Rumah', 'Pokok', 'Pelangi', 'Kereta'];

        }

        function renderStoryReadView(container, storyId) {
            const story = STORIES_BANK.find(s => s.id === storyId);
            let currentPage = 0;
            let viewingQuiz = false;

            function renderPageContent() {
                if (viewingQuiz) {
                    container.innerHTML = `
                        <div class="w-full max-w-xl bg-white rounded-3xl p-8 shadow-2xl border-4 border-teal-300 text-center">
                            <span class="text-5xl mb-3 block">❓</span>
                            <h3 class="text-2xl font-bold text-teal-800 mb-2">Soalan Pemahaman</h3>
                            <p class="text-lg text-gray-700 mb-6 font-semibold">${story.question}</p>

                            <div class="space-y-3 mb-6">
                                ${story.options.map((opt, idx) => `
                                    <button onclick="checkStoryQuiz(${idx}, ${story.answer})" class="btn-bouncy w-full bg-teal-50 hover:bg-teal-100 border-2 border-teal-300 text-teal-900 font-bold py-4 px-6 rounded-2xl text-xl shadow-sm">
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    return;
                }

                const text = story.pages[currentPage];
                const isLastPage = currentPage === story.pages.length - 1;

                container.innerHTML = `
                    <div class="w-full max-w-xl bg-white rounded-3xl p-8 shadow-2xl border-4 border-teal-300 text-center">
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-teal-100 text-teal-800 px-3 py-1 rounded-full font-bold text-xs">Halaman ${currentPage + 1} / ${story.pages.length}</span>
                            <span class="text-4xl">${story.cover}</span>
                        </div>

                        <h3 class="text-xl font-bold text-teal-700 mb-4">${story.title}</h3>
                        <p class="text-xl text-gray-800 leading-relaxed font-semibold mb-8 min-h-[100px] flex items-center justify-center">${text}</p>

                        <div class="flex justify-between items-center">
                            <button onclick="prevStoryPage()" class="btn-bouncy bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-2xl shadow-sm">
                                ⬅️ Sebelum
                            </button>
                            <button onclick="nextStoryPage()" class="btn-bouncy bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg">
                                ${isLastPage ? 'Selesai 🌟' : 'Seterusnya ➡️'}
                            </button>
                        </div>
                    </div>
                `;
                audioManager.speak(text);
            }

            window.nextStoryPage = () => {
                audioManager.playClick();
                if (currentPage < story.pages.length - 1) {
                    currentPage++;
                    renderPageContent();
                } else {
                    viewingQuiz = true;
                    renderPageContent();
                }
            };

            window.prevStoryPage = () => {
                audioManager.playClick();
                if (currentPage > 0) {
                    currentPage--;
                    renderPageContent();
                }
            };

            window.checkStoryQuiz = (selected, correct) => {
                if (selected === correct) {
                    audioManager.playCorrect();
                    state.addScore(20);
                    showModal('⭐', 'TAHNIAH!', 'Jawapan kamu betul! Kamu memahami cerita ini dengan sangat baik.', () => {
                        router.navigate('stories');
                    });
                } else {
                    audioManager.playWrong();
                    showModal('🤔', 'Cuba Lagi!', 'Cuba baca sekali lagi dan pilih jawapan yang tepat.');
                }
            };

            renderPageContent();
        }
